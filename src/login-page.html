<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="login-page-body">
    <div class="main-signin">
        <div class="login-page-wrapper">
            <a href="landing-page.html" class="back-link">← Back to home</a>

            <div class="login-card">
                <div class="login-header">
                    <h1 class="brand-name">DataMotionProV2</h1>
                    <h2 id="form-title">Welcome Back</h2>
                    <p id="form-subtitle">Sign in to access your workspace</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="name@company.com" required>
                    </div>
                    <div class="input-group">
                        <div class="label-row">
                            <label for="login-password">Password</label>
                            <a href="#" class="forgot-password">Forgot?</a>
                        </div>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" placeholder="••••••••" required>
                            <button type="button" class="toggle-btn" id="toggleLoginPassword">Show</button>
                        </div>
                    </div>  
                    <button type="submit" class="submit-btn">Login</button>
                </form>

                <form id="signupForm" class="auth-form" style="display: none;">
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="name@company.com" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" placeholder="Create a password" required>
                            <button type="button" class="toggle-btn" id="toggleSignupPassword">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>

                <div class="divider"><span>Or continue with</span></div>
                <button type="button" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>

                <p class="signup-footer">
                    <span id="toggle-text">Don't have an account?</span> 
                    <a href="javascript:void(0)" id="auth-toggle">Sign Up</a>
                </p>
            </div>

            <footer class="rights-footer">
                <span>© 2024 DataMotionProV2. All rights reserved.</span>
            </footer>
        </div>        
    </div>  

    <script>
        const authToggle = document.getElementById('auth-toggle');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const toggleText = document.getElementById('toggle-text');

        authToggle.addEventListener('click', () => {
            if (loginForm.style.display === 'none') {
                // Switch to LOGIN
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Sign in to access your workspace';
                authToggle.textContent = 'Sign Up';
                toggleText.textContent = "Don't have an account?";
            } else {
                // Switch to SIGN UP
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Join DataMotionProV2 today';
                authToggle.textContent = 'Login';
                toggleText.textContent = 'Already have an account?';
            }
        });

        function setupPasswordToggle(buttonId, inputId) {
        const toggleBtn = document.getElementById(buttonId);
        const passwordInput = document.getElementById(inputId);

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? 'Show' : 'Hide';
            });
        }
    }

    setupPasswordToggle('toggleLoginPassword', 'login-password');
    setupPasswordToggle('toggleSignupPassword', 'signup-password');
    </script>
</body>
</html>
